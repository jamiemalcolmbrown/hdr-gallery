<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="panel header-row">
        <button id="homeBtn" class="btn">Home</button>
      </div>
      <div class="panel">
        <div class="panel-title">State</div>
        <div id="stateFilters" class="chip-list"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Season</div>
        <div id="seasonFilters" class="chip-list"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Color</div>
        <div id="colorFilters" class="chip-list"></div>
      </div>
    </aside>
    <main class="main">
      <div id="emptyState" class="empty hidden">No images match your filters.</div>
      <div class="thumbs" id="thumbGrid" aria-live="polite"></div>
    </main>
  </div>

  <div id="viewer" class="viewer hidden" role="dialog" aria-modal="true">
    <div id="viewerTopBar" class="viewer-toolbar hidden">
      <button id="closeViewer" class="btn">Close</button>
      <button id="prevBtn" class="btn">⟨ Prev</button>
      <button id="nextBtn" class="btn">Next ⟩</button>
      <label class="row"><input type="checkbox" id="compareToggle" /> HDR Compare</label>
      <div class="row hidden" id="compareControl"><input type="range" id="compareSlider" min="0" max="100" value="50" /></div>
    </div>
    <figure class="stage">
      <div class="stage-container">
        <picture id="pic"><img id="img" alt="" /></picture>
        <div id="compareOverlay" class="compare-overlay hidden">
          <img id="compareSDR" alt="" />
          <img id="compareHDR" alt="" class="compare-clip" />
        </div>
        <div id="metaOverlay" class="meta-overlay"></div>
      </div>
    </figure>
  </div>

  <script src="/static/gallery.js"></script>
</body>
</html>
