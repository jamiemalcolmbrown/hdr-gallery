<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery v0.6.1</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="panel header-row">
        <button id="homeBtn" class="btn">Home</button>
      </div>
      <div class="panel" style="display:none;">
        <div class="panel-title">State</div>
        <div id="stateFilters" class="chip-list"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Season</div>
        <div id="seasonFilters" class="chip-list"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Color</div>
        <div id="colorFilters" class="chip-list"></div>
      </div>
    </aside>

    <main class="main">
      <div class="mobile-topbar" style="display: none;">
        <button id="menuBtn" class="btn" aria-label="Toggle filters">☰ Filters</button>
        <button id="homeBtnMobile" class="btn" aria-label="Home">Home</button>
      </div>
      <div id="emptyState" class="empty hidden">No images match your filters.</div>
      <div class="thumbs" id="thumbGrid" aria-live="polite"></div>
    </main>
  </div>

  <div id="viewer" class="viewer hidden" role="dialog" aria-modal="true">
    <div id="viewerTopBar" class="viewer-toolbar hidden">
      <button id="closeViewer" class="btn">Close</button>
      <button id="prevBtn" class="btn">⟨ Prev</button>
      <button id="nextBtn" class="btn">Next ⟩</button>
      <label class="row"><input type="checkbox" id="compareToggle" /> HDR Compare</label>
      <div class="row hidden" id="compareControl"><input type="range" id="compareSlider" min="0" max="100" value="50" /></div>
    </div>
    <figure class="stage">
      <div class="stage-container">
        <div id="layerHost" class="layer-host"></div>
        <picture id="pic"><img id="img" alt="" /></picture>
        <div id="compareOverlay" class="compare-overlay hidden">
          <img id="compareSDR" alt="" />
          <img id="compareHDR" alt="" class="compare-clip" />
        </div>
        <div id="metaOverlay" class="meta-overlay"></div>
      </div>
    </figure>
  </div>

  <script src="{{ url_for('static', filename='js/gallery.js') }}"></script>

  <!-- Lightweight SSE client: listens for remote filter events from the Pi -->
  <script>
  (function(){
    let es;
    function connect(){
      try {
        es = new EventSource('/events');
        es.onmessage = function(ev){
          let msg;
          try { msg = JSON.parse(ev.data); } catch(e) { return; }
          if (msg && msg.type === 'apply_filter' && msg.facet && msg.value) {
            applyFilterUI(msg.facet, msg.value);
          }
        };
        es.onerror = function(){
          try { es.close(); } catch(e){}
          setTimeout(connect, 2000);
        };
      } catch(e) {
        setTimeout(connect, 2000);
      }
    }

    function applyFilterUI(facet, value){
      // 1) Preferred: call gallery helper if present
      if (window.setFilter) {
        try { window.setFilter(facet, value); return; } catch(e){}
      }
      // 2) Try clicking the chip that matches the text
      const map = { state: 'stateFilters', season: 'seasonFilters', color: 'colorFilters' };
      const container = document.getElementById(map[facet] || '');
      if (container) {
        const chips = Array.from(container.querySelectorAll('.chip'));
        const target = chips.find(ch => ch.textContent.trim().toLowerCase() === String(value).toLowerCase());
        if (target) { target.click(); return; }
      }
      // 3) Fallback: use URL param to hint the gallery code
      const url = new URL(location.href);
      url.searchParams.set(facet, value);
      location.href = url.toString();
    }

    window.applyFilterUI = applyFilterUI; // exposed for debugging
    connect();
  })();
  </script>
</body>
</html>
