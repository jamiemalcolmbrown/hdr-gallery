<!doctype html>
<html><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Metadata Health</title>
<link rel="stylesheet" href="/static/styles.css"/>
</head>
<body class="health">
  <div class="health-wrap">
    <h1>Metadata Health</h1>
    <div id="summary" class="summary">Loading…</div>
    <div class="cols">
      <div>
        <h2>Missing State</h2>
        <ul id="missingState"></ul>
      </div>
      <div>
        <h2>Missing Season</h2>
        <ul id="missingSeason"></ul>
      </div>
    </div>
  </div>
<script>
(async function() {
  const r = await fetch('/meta/health.json', {cache:'no-store'});
  const j = await r.json();
  const s = document.getElementById('summary');
  s.textContent = `Total: ${j.counts.total} • Missing State: ${j.counts.missing_state} • Missing Season: ${j.counts.missing_season}`;
  const ms = document.getElementById('missingState');
  const msea = document.getElementById('missingSeason');
  j.missing_state.forEach(k => { const li = document.createElement('li'); li.textContent = k; ms.appendChild(li); });
  j.missing_season.forEach(k => { const li = document.createElement('li'); li.textContent = k; msea.appendChild(li); });
})();
</script>
</body></html>
